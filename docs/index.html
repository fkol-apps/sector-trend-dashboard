<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セクター別トレンド銘柄ダッシュボード</title>
<meta name="description" content="日本株・米国株のセクター別トレンド銘柄を、長期・中期・短期の3つの時間軸で俯瞰する一次スクリーニング用ダッシュボード。">
<meta name="color-scheme" content="light dark">

<!-- ホーム画面に追加したときのアイコンと名前（iOSは manifest ではなくこちらを見る） -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Trends">
<meta name="application-name" content="Trends">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="titles">
      <h1>セクター別トレンド銘柄</h1>
      <p class="subtitle" id="subtitle">読み込み中…</p>
    </div>

    <div class="controls">
      <div class="segmented" id="market-toggle" role="group" aria-label="市場の切り替え"></div>
      <div class="segmented" id="view-toggle" role="group" aria-label="表示の切り替え"></div>
      <div class="chips" id="timeframe-chips" role="group" aria-label="時間軸フィルタ"></div>
      <div class="color-legend" id="color-legend" hidden title="色はスコア（市場全体での相対強度）を表します">
        <span>弱い</span><i class="legend-bar"></i><span>強い</span>
      </div>
    </div>

    <div class="meta" id="meta"></div>
  </div>

  <div class="board-head" id="board-head"></div>
</header>

<main class="board-wrap">
  <div class="board" id="board"></div>
</main>

<div class="status" id="status" hidden></div>

<dialog class="detail" id="detail" aria-label="銘柄の詳細">
  <div class="detail-body" id="detail-body"></div>
</dialog>

<footer class="disclaimer">
  本ツールは過去の値動きに基づく機械的なスクリーニング結果であり、投資助言ではありません。投資判断はご自身の責任で行ってください。
</footer>

<script src="app.js"></script>
</body>
</html>
